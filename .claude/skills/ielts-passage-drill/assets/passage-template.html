<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<title>تمرین ترجمهٔ متن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface-alt:#F0EEE6;
    --text:#141413; --text-2:#6C6B68; --text-3:#8F8E8A;
    --line:#E5E3DA; --line-2:#D6D3C7;
    --accent:#D97757; --accent-deep:#B85C3E; --en:#3B4A6B;
    --fa:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:calc(1.1rem + env(safe-area-inset-top)) 0 calc(3rem + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--text);font-family:var(--fa);font-size:16px;line-height:1.8;
    overflow-wrap:break-word}
  .wrap{max-width:44rem;margin:0 auto;padding:0 .95rem}

  en{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);color:var(--en)}
  x{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);color:var(--accent-deep);
    text-decoration:line-through;text-decoration-thickness:1px}

  h1{font-size:1.05rem;font-weight:700;margin:0 0 .3rem;line-height:1.6}
  .hint{margin:0 0 1.1rem;color:var(--text-3);font-size:.84rem;line-height:1.75}

  /* ── فهرست متن‌ها ───────────────────────── */
  .toc{margin:0 0 1.3rem;padding:.65rem .3rem;background:var(--surface-alt);border-radius:10px}
  .toc button{display:block;width:100%;text-align:right;font:inherit;font-size:.87rem;
    color:var(--text-2);background:none;border:0;padding:.5rem .65rem;cursor:pointer;
    border-radius:7px;line-height:1.6}
  .toc button:active{background:#E7E4DA}

  /* ── عنوان هر متن ───────────────────────── */
  .ttl{font-size:.98rem;font-weight:700;color:var(--text);margin:2.1rem 0 .95rem;
    padding-top:1.2rem;border-top:1px solid var(--line);scroll-margin-top:1rem}
  .text:first-child .ttl{margin-top:0;padding-top:0;border-top:0}

  /* ── متن پیوسته ─────────────────────────── */
  .block{margin-bottom:.3rem}
  .para{margin:0 0 .55rem;font-size:1.05rem;line-height:1.85}
  .s{cursor:pointer;border-radius:5px;padding:.12rem .1rem;
    transition:background .15s ease;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .s:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .s.active{background:#F3E9E4;color:var(--text);font-weight:500}
  .s.cp{box-shadow:inset 0 -2px 0 var(--accent)}

  .jump{display:none;width:100%;margin:0 0 1.1rem;min-height:44px;
    font:inherit;font-size:.86rem;font-weight:500;color:var(--accent-deep);
    background:#F6EDE9;border:1px solid #EBD9D1;border-radius:10px;
    padding:.6rem .9rem;cursor:pointer;text-align:center}
  .jump.on{display:block}

  .drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .drawer.open{grid-template-rows:1fr}
  .drawer > div{overflow:hidden}
  .panel{margin:.95rem 0 1.2rem;background:var(--surface);border:1px solid var(--line-2);
    border-radius:14px;padding:1.05rem .9rem}

  .attempt label{display:block;font-size:.82rem;color:var(--text-3);margin-bottom:.45rem}
  textarea{width:100%;min-height:4.4rem;resize:vertical;direction:ltr;text-align:left;
    font-family:var(--serif);font-size:1rem;line-height:1.6;color:var(--en);
    padding:.65rem .75rem;background:var(--bg);border:1px solid var(--line);border-radius:9px}
  textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  .acts{display:flex;align-items:center;gap:.5rem;margin-top:.7rem}
  .reveal{flex:1;min-height:44px;font:inherit;font-size:.92rem;font-weight:500;
    padding:.65rem 1rem;background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer}
  .reveal:active{background:var(--accent-deep)}

  .answer[hidden]{display:none}
  .answer{margin-top:1.15rem;padding-top:1.05rem;border-top:1px solid var(--line)}

  .en-line{direction:ltr;text-align:left;font-family:var(--serif);font-weight:600;
    font-size:1.08rem;line-height:1.5;color:var(--en);margin:0 0 1.15rem;
    padding-bottom:.9rem;border-bottom:1px solid var(--line)}
  .cp-btn{flex:none;width:44px;height:44px;
    display:grid;place-items:center;background:none;border:0;border-radius:10px;cursor:pointer}
  .cp-btn i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--line-2);transition:background .15s ease,border-color .15s ease}
  .cp-btn svg{width:14px;height:16px;display:block}
  .cp-btn svg path{fill:none;stroke:var(--text-3);stroke-width:1.7;
    stroke-linejoin:round;stroke-linecap:round}
  .cp-btn.on i{background:var(--accent);border-color:var(--accent)}
  .cp-btn.on svg path{fill:#fff;stroke:#fff}
  .cp-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

  .row{margin-bottom:1.2rem}
  .row:last-child{margin-bottom:0}
  .key{font-size:.78rem;color:var(--text-3);line-height:1.6;margin-bottom:.25rem}
  .val{font-size:.95rem;line-height:1.85}
  .val > p{margin:0 0 .6rem}
  .val > p:last-child{margin-bottom:0}

  .skeleton{direction:ltr;text-align:left;font-family:var(--serif);font-size:.97rem;
    color:var(--en);background:var(--surface-alt);border-radius:8px;padding:.55rem .7rem;line-height:1.6;
    overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}

  ul.misses{margin:0;padding:0;list-style:none}
  ul.misses li{margin-bottom:.85rem;padding-inline-start:1.1rem;position:relative}
  ul.misses li:last-child{margin-bottom:0}
  ul.misses li::before{content:"\00d7";position:absolute;inset-inline-start:0;top:0;
    color:var(--accent-deep);font-weight:600}
  ul.misses .bad{direction:ltr;unicode-bidi:isolate;font-family:var(--serif);color:var(--accent-deep);
    display:inline-block;line-height:1.55}
  ul.misses em{display:block;font-style:normal;font-size:.89rem;color:var(--text-2);line-height:1.75;margin-top:.2rem}

  ul.mini{margin:.5rem 0 0;padding:0;list-style:none}
  ul.mini li{margin-bottom:.5rem;padding-inline-start:.85rem;position:relative;font-size:.92rem;line-height:1.75}
  ul.mini li:last-child{margin-bottom:0}
  ul.mini li::before{content:"";position:absolute;inset-inline-start:0;top:.8rem;
    width:4px;height:4px;border-radius:50%;background:var(--line-2)}
  ul.mini em{font-style:normal;color:var(--text-2);font-size:.87rem}

  .row.trap .key{color:var(--accent-deep)}

  @media (min-width:640px){
    body{font-size:17px;padding-bottom:6rem}
    .wrap{padding:0 1.5rem}
    h1{font-size:1.25rem}
    .ttl{font-size:1.1rem}
    .para{font-size:1.12rem;line-height:1.95}
    .en-line{font-size:1.18rem}
    .reveal{flex:none;padding:.6rem 1.5rem}
    .panel{padding:1.4rem}
    .row{display:grid;grid-template-columns:7rem 1fr;gap:0 1.1rem}
    .key{line-height:1.9;margin-bottom:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="hint">متن را جمله‌به‌جمله جلو برو. اول در ذهنت ترجمه کن، بعد روی جمله بزن. هر لحظه فقط یک جمله باز می‌شود.</p>
  <div class="toc" id="toc"></div>
  <button class="jump" type="button" id="jump">ادامه از چک‌پوینت ↓</button>
  <div id="passage"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   برای افزودن متن تازه فقط به آرایهٔ TEXTS اضافه کن.
   داخل رشته‌های فارسی، انگلیسی را در <en>…</en> بگذار
   و شکل غلط را در <x>…</x>.
   newPara: true یعنی این واحد پاراگراف تازه‌ای را شروع کند.
   ══════════════════════════════════════════════════════════ */

const TITLE     = "تمرین ترجمهٔ متن — گرامر IELTS";
const STORE_KEY = "ielts-passage";

const TEXTS = [
];

/* ══════════════════════════════════════════════════════════
   از اینجا به بعد موتور است. دست نخورد.
   ══════════════════════════════════════════════════════════ */

const BOOKMARK = '<svg viewBox="0 0 14 16" xmlns="http://www.w3.org/2000/svg"><path d="M2.2 1.4h9.6v13.2L7 11.2l-4.8 3.4z"/></svg>';
const row = (k, v, c='') => `<div class="row ${c}"><div class="key">${k}</div><div class="val">${v}</div></div>`;

/* شماره‌گذاری سراسری واحدها در کل فایل */
const FLAT = [];
TEXTS.forEach((t, ti) => t.items.forEach(it => FLAT.push({ it, ti })));

function answerHTML(it){
  let b = `<p class="en-line">${it.en}</p>`;
  b += row('اسکلت', `<div class="skeleton">${it.skeleton}</div>`);
  if (it.why?.length) b += row(it.whyKey || 'چرا این شکل', it.why.map(p=>`<p>${p}</p>`).join(''));
  if (it.trap) b += row('تلهٔ فارسی', it.trap, 'trap');
  if (it.misses?.length) b += row('اگر این را نوشتی',
    `<ul class="misses">${it.misses.map(m=>`<li><span class="bad">${m.en}</span><em>${m.why}</em></li>`).join('')}</ul>`);
  if (it.alt) b += row('هم قبول است', it.alt);
  if (it.rule){
    let r = it.rule.intro ? `<p>${it.rule.intro}</p>` : '';
    if (it.rule.examples?.length)
      r += `<ul class="mini">${it.rule.examples.map(e=>`<li><en>${e.en}</en> <em>${e.fa||''}</em></li>`).join('')}</ul>`;
    if (it.rule.outro) r += `<p style="margin-top:.7rem">${it.rule.outro}</p>`;
    b += row('قاعدهٔ کلی', r);
  }
  return b;
}

document.getElementById('title').textContent = TITLE;

/* گروه‌بندی واحدها به پاراگراف، درون هر متن */
const html = TEXTS.map((t, ti) => {
  const idx = FLAT.map((f, n) => f.ti === ti ? n : -1).filter(n => n >= 0);
  const paras = [];
  idx.forEach(n => {
    if (!paras.length || FLAT[n].it.newPara) paras.push([]);
    paras[paras.length - 1].push(n);
  });
  const body = paras.map(p => {
    return `<div class="block">
      <div class="para">${p.map(n =>
        `<span class="s" data-i="${n}" role="button" tabindex="0">${FLAT[n].it.fa}</span>`).join(' ')}</div>
    </div>`;
  }).join('');
  return `<section class="text"><h2 class="ttl" id="text-${ti}">${t.title}</h2>${body}</section>`;
}).join('');

document.getElementById('passage').innerHTML = html;
const tocEl = document.getElementById('toc');
if (TEXTS.length > 1)
  tocEl.innerHTML = TEXTS.map((t, ti) => `<button type="button" data-t="${ti}">${t.title}</button>`).join('');
else
  tocEl.style.display = 'none';

(function(){
  const spans   = [...document.querySelectorAll('.s')];
  const jumpBtn = document.getElementById('jump');
  const KEY = STORE_KEY + '-cp';
  let active = null, mem = null, gen = 0, keepEl = null;

  /* یک کشوی واحد که زیر جملهٔ فعال جابه‌جا می‌شود */
  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  drawer.innerHTML = '<div><div class="slot"></div></div>';
  const slot = drawer.querySelector('.slot');

  const readCP = () => {
    let v; try { v = localStorage.getItem(KEY); } catch(e){ v = mem; }
    if (v === null || v === undefined) return null;
    const n = +v;
    return (Number.isInteger(n) && n >= 0 && n < FLAT.length) ? n : null;
  };
  const writeCP = v => {
    mem = v;
    try { v === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, v); } catch(e){}
  };
  const paintCP = () => {
    const cp = readCP();
    spans.forEach((sp, i) => sp.classList.toggle('cp', i === cp));
    jumpBtn.classList.toggle('on', cp !== null);
  };

  /* کمترین اسکرول ممکن: پنل در دید بیاید، ولی جمله از بالای صفحه بیرون نرود */
  function bring(keep){
    if (active === null) return;
    keepEl = keep || null;
    const vh = (window.visualViewport && window.visualViewport.height) || innerHeight;
    const r  = spans[active].getBoundingClientRect();
    const kb = keepEl ? keepEl.getBoundingClientRect().bottom
                      : drawer.getBoundingClientRect().top + slot.offsetHeight;
    if (kb <= vh - 12 && r.top >= 8) return;
    const delta = Math.min(kb - vh + 16, r.top - vh * 0.12);
    if (Math.abs(delta) > 4) window.scrollBy({ top: delta, behavior: 'smooth' });
  }

  function close(animate){
    if (active === null) return;
    spans[active].classList.remove('active');
    drawer.classList.remove('open');
    active = null; keepEl = null;
    const my = ++gen;
    if (animate) setTimeout(() => { if (my === gen && drawer.parentNode) drawer.remove(); }, 300);
    else if (drawer.parentNode) drawer.remove();
  }

  function open(i){
    close(false);
    active = i; gen++;
    const isCP = readCP() === i;
    slot.innerHTML = `
      <div class="panel">
        <div class="attempt">
          <label>ترجمه‌ات را بنویس (اختیاری):</label>
          <textarea spellcheck="false" autocomplete="off"></textarea>
          <div class="acts">
            <button class="reveal" type="button">نمایش پاسخ</button>
            <button class="cp-btn${isCP ? ' on' : ''}" type="button" aria-pressed="${isCP}" aria-label="چک‌پوینت"><i>${BOOKMARK}</i></button>
          </div>
        </div>
        <div class="answer" hidden>${answerHTML(FLAT[i].it)}</div>
      </div>`;

    spans[i].classList.add('active');
    spans[i].after(drawer);
    requestAnimationFrame(() => { if (active === i) drawer.classList.add('open'); });

    const ta     = slot.querySelector('textarea');
    const ans    = slot.querySelector('.answer');
    const revBtn = slot.querySelector('.reveal');

    const reveal = () => {
      if (!ans.hidden) return;
      ans.hidden = false;
      revBtn.hidden = true;
      bring(ans.querySelector('.en-line'));
    };
    const next = () => { i + 1 < FLAT.length ? open(i + 1) : close(true); };

    revBtn.addEventListener('click', reveal);

    slot.querySelector('.cp-btn').addEventListener('click', e => {
      const on = readCP() !== i;
      writeCP(on ? i : null);
      e.currentTarget.classList.toggle('on', on);
      e.currentTarget.setAttribute('aria-pressed', on);
      paintCP();
    });

    /* Enter → نمایش پاسخ، Enter دوباره → جملهٔ بعدی، Shift+Enter → خط تازه */
    ta.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      ans.hidden ? reveal() : next();
    });

    ta.focus({ preventScroll: true });
    bring(null);
  }

  spans.forEach(sp => {
    const i = +sp.dataset.i;
    const go = () => { if (active === i) close(true); else open(i); };
    sp.addEventListener('click', go);
    sp.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  });

  /* بالاآمدن کیبورد روی موبایل ارتفاع دید را عوض می‌کند */
  if (window.visualViewport){
    let t;
    window.visualViewport.addEventListener('resize', () => {
      clearTimeout(t);
      t = setTimeout(() => bring(keepEl), 150);
    });
  }

  jumpBtn.addEventListener('click', () => {
    const cp = readCP();
    if (cp !== null) spans[cp].scrollIntoView({block:'center', behavior:'smooth'});
  });

  document.getElementById('toc').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]');
    if (b) document.getElementById('text-' + b.dataset.t)
      .scrollIntoView({block:'start', behavior:'smooth'});
  });

  paintCP();
})();
</script>

</body>
</html>
